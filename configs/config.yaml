# Data Configuration
data:
  n_samples: 1000
  test_size: 0.2
  random_seed: 42
  
  # Feature distributions
  features:
    study_time:
      mean: 5.0
      std: 1.5
    learning_style_score:
      min: 0.0
      max: 1.0
    previous_performance:
      mean: 80.0
      std: 10.0
    engagement_score:
      min: 0.0
      max: 1.0
    resource_preference:
      min: 0
      max: 2

# Model Configuration
models:
  neural_network:
    hidden_layers: [64, 32]
    activation: "relu"
    output_activation: "softmax"
    optimizer: "adam"
    loss: "sparse_categorical_crossentropy"
    metrics: ["accuracy"]
    epochs: 15
    batch_size: 32
    
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    random_state: 42
    
  lightgbm:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    random_state: 42

# Evaluation Configuration
evaluation:
  metrics:
    - "accuracy"
    - "precision_macro"
    - "recall_macro"
    - "f1_macro"
    - "confusion_matrix"
  
  cross_validation:
    cv_folds: 5
    random_state: 42

# Resource Types
resources:
  video: 0
  quiz: 1
  reading: 2
  
  names:
    0: "Video"
    1: "Quiz"
    2: "Reading Article"
